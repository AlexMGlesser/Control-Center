<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'" />
    <title>Alarm</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        border: 1px solid var(--magenta);
        -webkit-app-region: drag;
      }
      .ring {
        text-align: center;
        padding: 20px;
      }
      .ring h1 {
        margin: 6px 0 4px;
        font-size: 26px;
      }
      .ring .time {
        color: var(--magenta);
        font-size: 15px;
        letter-spacing: 0.1em;
      }
      .ring button {
        -webkit-app-region: no-drag;
        margin-top: 18px;
        font-size: 18px;
        padding: 12px 40px;
      }
    </style>
  </head>
  <body>
    <div class="ring">
      <div class="time" id="time"></div>
      <h1 id="label">Alarm</h1>
      <button class="btn magenta" id="stop" autofocus>Stop</button>
    </div>
    <script type="module" src="./alarm.js"></script>
  </body>
</html>
